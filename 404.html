<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khiraj &amp; Diksha — Wedding Celebration</title>
  <meta http-equiv="refresh" content="2; url=./index.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(ellipse at 50% 30%, #4A121B 0%, #25070D 60%, #120205 100%);
      color: #FAF4E8;
      font-family: 'Montserrat', sans-serif;

      flex-direction: column;

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3.5rem;
      color: #DFCA9B;
      line-height: 1.1;
      margin-bottom: 8px;
    }
    p {
      color: #E8D8C3;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    a.btn-home {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #E8CA82 0%, #C4A15A 100%);
      color: #26070E;
      font-weight: 700;
      text-decoration: none;
      border-radius: 30px;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="./assets/images/ganpati-light.svg" class="ganpati-icon" alt="">
    <h1>Khiraj &amp; Diksha</h1>
    <p>Redirecting you to our sacred wedding celebration...</p>
    <a href="./index.html" class="btn-home">Enter Wedding Celebration &rarr;</a>
  </div>

</html>
