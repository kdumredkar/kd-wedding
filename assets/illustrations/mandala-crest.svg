<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" aria-label="Auspicious Wedding Floral Mandala Crest">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E5D4" />
      <stop offset="50%" stop-color="#C4A15A" />
      <stop offset="100%" stop-color="#9E7D36" />
    </linearGradient>
  </defs>
  <g transform="translate(80, 80)" stroke="url(#crestGold)" fill="none" stroke-linecap="round">
    <!-- Center Auspicious Rings -->
    <circle cx="0" cy="0" r="14" stroke-width="1.5" />
    <circle cx="0" cy="0" r="22" stroke-width="1" stroke-dasharray="2 3" />
    <circle cx="0" cy="0" r="32" stroke-width="1.2" />
    <circle cx="0" cy="0" r="48" stroke-width="0.8" stroke-dasharray="1 3" />
    <circle cx="0" cy="0" r="62" stroke-width="1.5" />

    <!-- Center Ruby Dot -->
    <circle cx="0" cy="0" r="5" fill="#792E38" stroke="none" />
    <circle cx="0" cy="0" r="2" fill="#FFFFFF" stroke="none" />

    <!-- 8 Lotus Petal Radiations -->
    <g stroke-width="1.2">
      <!-- 0 deg -->
      <path d="M0,-14 C-7,-24 0,-34 0,-44 C0,-34 7,-24 0,-14 Z" fill="#792E38" fill-opacity="0.15" />
      <!-- 45 deg -->
      <path d="M10,-10 C4,-20 12,-28 17,-35 C20,-28 20,-16 10,-10 Z" fill="#792E38" fill-opacity="0.12" transform="rotate(45)" />
      <!-- 90 deg -->
      <path d="M0,-14 C-7,-24 0,-34 0,-44 C0,-34 7,-24 0,-14 Z" fill="#792E38" fill-opacity="0.15" transform="rotate(90)" />
      <!-- 135 deg -->
      <path d="M10,-10 C4,-20 12,-28 17,-35 C20,-28 20,-16 10,-10 Z" fill="#792E38" fill-opacity="0.12" transform="rotate(135)" />
      <!-- 180 deg -->
      <path d="M0,-14 C-7,-24 0,-34 0,-44 C0,-34 7,-24 0,-14 Z" fill="#792E38" fill-opacity="0.15" transform="rotate(180)" />
      <!-- 225 deg -->
      <path d="M10,-10 C4,-20 12,-28 17,-35 C20,-28 20,-16 10,-10 Z" fill="#792E38" fill-opacity="0.12" transform="rotate(225)" />
      <!-- 270 deg -->
      <path d="M0,-14 C-7,-24 0,-34 0,-44 C0,-34 7,-24 0,-14 Z" fill="#792E38" fill-opacity="0.15" transform="rotate(270)" />
      <!-- 315 deg -->
      <path d="M10,-10 C4,-20 12,-28 17,-35 C20,-28 20,-16 10,-10 Z" fill="#792E38" fill-opacity="0.12" transform="rotate(315)" />
    </g>

    <!-- Outer Scallop & Pearl Points -->
    <g fill="#D8C49A">
      <circle cx="0" cy="-62" r="2.5" />
      <circle cx="43.8" cy="-43.8" r="2.5" />
      <circle cx="62" cy="0" r="2.5" />
      <circle cx="43.8" cy="43.8" r="2.5" />
      <circle cx="0" cy="62" r="2.5" />
      <circle cx="-43.8" cy="43.8" r="2.5" />
      <circle cx="-62" cy="0" r="2.5" />
      <circle cx="-43.8" cy="-43.8" r="2.5" />
    </g>
  </g>
</svg>
